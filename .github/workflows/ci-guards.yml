name: CI Guards

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security-guards:
    name: Security Guards (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Block supabaseAdmin usage outside *.server.ts / src/routes/api
        run: |
          set -uo pipefail
          # Usos reais (chamada ou import) do cliente admin fora de arquivos
          # de servidor. Não contam: testes/mocks, linhas de comentário e o
          # `http-client.server` (não é o cliente admin do Supabase).
          #
          # Exceções conhecidas (TODO: mover para *.server.ts):
          #   - fiscal/v2/repositories/certificate.repository.ts
          #   - bella-ai/agent/execution-log.ts
          rg -nP \
            --glob '!**/*.server.ts' --glob '!src/routes/api/**' \
            --glob '!docs/**' --glob '!.github/**' \
            --glob '!**/*.test.ts' --glob '!**/*.test.tsx' \
            --glob '!**/__tests__/**' --glob '!**/*.mock.ts' \
            --glob '!src/features/fiscal/v2/repositories/certificate.repository.ts' \
            --glob '!src/features/bella-ai/agent/execution-log.ts' \
            '(\bsupabaseAdmin\s*[\.\(])|from\s+["'"'"'][^"'"'"']*supabase/client\.server' src/ > /tmp/admin-usage.txt
          rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::ripgrep falhou (código $rc)."
            exit 1
          fi
          matches=$(grep -vE '^[^:]+:[0-9]+:\s*(\*|//)' /tmp/admin-usage.txt || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::supabaseAdmin used outside *.server.ts / src/routes/api (see ADR-016)."
            exit 1
          fi

      - name: Block SERVICE_ROLE key access in client code
        run: |
          set -euo pipefail
          if rg -nP --glob '!**/*.server.ts' --glob '!docs/**' --glob '!.github/**' '(process\.env|import\.meta\.env)\.[A-Z_]*SERVICE_ROLE' src/; then
            echo "::error::SERVICE_ROLE key referenced outside *.server.ts (see ADR-016)."
            exit 1
          fi

      - name: Block VITE_*SERVICE_ROLE* env access
        run: |
          set -euo pipefail
          if rg -n 'VITE_[A-Z_]*SERVICE_ROLE' src/; then
            echo "::error::VITE_*SERVICE_ROLE* env var must never exist.".
            exit 1
          fi
